about:
  content: >
    # О проекте IT-Tools

    Этот замечательный сайт, созданный ❤ Корентеном Томассе ([Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about)), объединяет полезные инструменты для разработчиков и специалистов в сфере IT. Если сайт оказался вам полезен, поделитесь им с теми, кому он тоже может пригодиться, и не забудьте добавить его в панель закладок!

    IT-Tools — это бесплатный проект с открытым исходным кодом (лицензия GPL-3.0), и таким он будет всегда, но хостинг и продление домена обходятся мне денег. Если вы хотите поддержать мою работу и мотивировать меня добавлять новые инструменты, рассмотрите возможность [поддержать меня финансово](https://www.buymeacoffee.com/cthmsst).

    ## Технологии

    IT-Tools создан на Vue.js (Vue 3) с библиотекой компонентов Naive UI, а его хостинг и непрерывное развёртывание выполняются с помощью Vercel. В некоторых инструментах используются сторонние библиотеки с открытым исходным кодом — полный список можно найти в файле [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) репозитория.

    ## Нашли ошибку? Не хватает инструмента?

    Если нужного вам инструмента пока нет на сайте и вы считаете, что он был бы полезен, отправьте предложение в разделе [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) репозитория на GitHub.

    А если вы нашли ошибку или что-то работает не так, как ожидалось, сообщите о ней в разделе [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) репозитория на GitHub.
